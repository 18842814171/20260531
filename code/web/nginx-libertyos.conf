# LibertyOS — nginx 站点配置
# 安装: sudo cp nginx-libertyos.conf /etc/nginx/sites-available/libertyos
#       sudo ln -sfn /etc/nginx/sites-available/libertyos /etc/nginx/sites-enabled/libertyos
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# 方案 B: 用户访问 :3333 → nginx 反代 → Flask :5000（仅 127.0.0.1）
# 1. 后端: cd code/myos/web && ./start_server.sh
# 2. 安装本配置并重载 nginx（见上方命令）
# 3. 浏览器打开 http://<主机>:3333

server {
    listen 3333 default_server;
    listen [::]:3333 default_server;
    server_name _;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}
